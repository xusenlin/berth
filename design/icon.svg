<!-- Berth's icon: the macOS grid, an 824 px rounded square on a 1024 px
     canvas, flat teal with a white anchor. `task icon` renders
     design/icon.png. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0F8C88" filter="url(#shadow)"/>
  <!-- lucide "anchor", 24 px grid scaled 18× around the center -->
  <g transform="translate(296 296) scale(18)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22V8"/>
    <path d="M5 12H2a10 10 0 0 0 20 0h-3"/>
    <circle cx="12" cy="5" r="3"/>
  </g>
</svg>
