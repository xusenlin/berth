<!-- Berth's icon: the macOS grid, an 824 px rounded square on a 1024 px
     canvas. Two server racks stacked into a B, on the 港湾 palette's
     gradient; frontend/src/components/logo.tsx draws the same mark on a
     24 px grid. `task icon` renders design/icon.png. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26A7D0"/>
      <stop offset="1" stop-color="#008F7F"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <!-- the 24 px mark scaled to the 824 px square -->
  <g transform="translate(100 100) scale(34.333)" stroke-width="0.8" stroke-linejoin="round">
    <path d="M6.5 5.25h7a3.25 3.25 0 0 1 0 6.5h-7z" fill="#FFFFFF" stroke="#FFFFFF"/>
    <path d="M6.5 12.75h8.25a3.25 3.25 0 0 1 0 6.5H6.5z" fill="#CAF1F0" stroke="#CAF1F0"/>
    <circle cx="9.1" cy="8.5" r="1.1" fill="#008F7F"/>
    <circle cx="9.1" cy="16" r="1.1" fill="#26A7D0"/>
  </g>
</svg>
