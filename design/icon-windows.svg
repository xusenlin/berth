<!-- Berth's Windows icon: design/icon.svg edge to edge, without the macOS
     grid's margin and shadow, as Windows icons are drawn. `task icon`
     renders design/icon-windows.png. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="160" fill="#0F8C88"/>
  <!-- lucide "anchor", 24 px grid scaled 26× around the center -->
  <g transform="translate(200 200) scale(26)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22V8"/>
    <path d="M5 12H2a10 10 0 0 0 20 0h-3"/>
    <circle cx="12" cy="5" r="3"/>
  </g>
</svg>
