<!-- Berth's Windows icon: design/icon.svg edge to edge, without the macOS
     grid's margin and shadow, as Windows icons are drawn. `task icon`
     renders design/icon-windows.png. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26A7D0"/>
      <stop offset="1" stop-color="#008F7F"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="160" fill="url(#tile)"/>
  <!-- the 24 px mark scaled to the 1024 px square -->
  <g transform="scale(42.667)" stroke-width="0.8" stroke-linejoin="round">
    <path d="M6.5 5.25h7a3.25 3.25 0 0 1 0 6.5h-7z" fill="#FFFFFF" stroke="#FFFFFF"/>
    <path d="M6.5 12.75h8.25a3.25 3.25 0 0 1 0 6.5H6.5z" fill="#CAF1F0" stroke="#CAF1F0"/>
    <circle cx="9.1" cy="8.5" r="1.1" fill="#008F7F"/>
    <circle cx="9.1" cy="16" r="1.1" fill="#26A7D0"/>
  </g>
</svg>
